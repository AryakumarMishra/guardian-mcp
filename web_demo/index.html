<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guardian MCP - simulator</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f3ef; color: #26211a; }
  header { padding: 14px 20px; background: #1f1b16; color: #fff; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header span { font-size: 12px; color: #c9c3b8; }
  .layout { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; padding: 16px; height: calc(100vh - 54px); }
  .panel { background: #fff; border: 1px solid #e3e0d8; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  .panel h2 { font-size: 13px; margin: 0; padding: 10px 14px; border-bottom: 1px solid #e3e0d8; background: #faf9f6; }
  #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
  .msg.user { align-self: flex-end; background: #2d6a4f; color: #fff; }
  .msg.assistant { align-self: flex-start; background: #ece8df; color: #26211a; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e3e0d8; }
  input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid #d8d4c9; border-radius: 8px; font-size: 14px; }
  button { padding: 10px 16px; border: none; border-radius: 8px; background: #2d6a4f; color: #fff; font-size: 14px; cursor: pointer; }
  button.secondary { background: #e3e0d8; color: #26211a; }
  button.danger { background: #a3352c; }
  .right-stack { display: flex; flex-direction: column; gap: 16px; }
  #tool-feed, #audit-feed { flex: 1; overflow-y: auto; padding: 10px 14px; font-size: 12.5px; }
  .card { border: 1px solid #e3e0d8; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .tier { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: 10px; margin-left: 6px; }
  .tier.safe { background: #dfeee6; color: #1c6b46; }
  .tier.moderate { background: #e9e4d0; color: #7a5e12; }
  .tier.high { background: #f4dcd8; color: #9a2f24; }
  .pending-actions { margin-top: 6px; display: flex; gap: 6px; }
  .pending-actions button { padding: 4px 10px; font-size: 12px; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 4px 0 0; font-family: ui-monospace, monospace; font-size: 11.5px; color: #55503f; }
  .toolbar { display: flex; justify-content: flex-end; padding: 8px 14px; border-top: 1px solid #e3e0d8; }
</style>
</head>
<body>
<header>
  <h1>Guardian MCP</h1>
  <span>web simulator - agent runs via local Ollama, tools run through the real MCP guardrail</span>
</header>

<div class="layout">
  <div class="panel">
    <h2>Chat</h2>
    <div id="chat"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Ask it to add a reminder, delete one, unlock the door..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <div class="right-stack">
    <div class="panel" style="flex:1">
      <h2>Tool activity</h2>
      <div id="tool-feed"></div>
    </div>
    <div class="panel" style="flex:1">
      <h2>Audit log</h2>
      <div id="audit-feed"></div>
      <div class="toolbar"><button class="secondary" onclick="resetDemo()">Reset demo data</button></div>
    </div>
  </div>
</div>

<script>
let history = [];

const chatEl = document.getElementById('chat');
const toolFeedEl = document.getElementById('tool-feed');
const auditFeedEl = document.getElementById('audit-feed');

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderToolTrace(trace) {
  for (const call of trace) {
    const card = document.createElement('div');
    card.className = 'card';
    let resultObj = null;
    try { resultObj = JSON.parse(call.result); } catch (e) {}
    const pending = resultObj && resultObj.status === 'confirmation_required';
    card.innerHTML = `<strong>${call.name}</strong>${call.isError ? ' <span class="tier high">error</span>' : ''}
      <pre>${call.result}</pre>`;
    if (pending) {
      const actions = document.createElement('div');
      actions.className = 'pending-actions';
      const confirmBtn = document.createElement('button');
      confirmBtn.textContent = 'Confirm';
      confirmBtn.onclick = () => resolveAction(resultObj.confirmation_id, 'confirm', card);
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'danger';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = () => resolveAction(resultObj.confirmation_id, 'cancel', card);
      actions.appendChild(confirmBtn);
      actions.appendChild(cancelBtn);
      card.appendChild(actions);
    }
    toolFeedEl.prepend(card);
  }
}

async function resolveAction(confirmationId, action, card) {
  const res = await fetch(`/agent/${action}/${confirmationId}`, { method: 'POST' });
  const data = await res.json();
  const note = document.createElement('div');
  note.style.marginTop = '6px';
  note.style.fontSize = '12px';
  note.textContent = data.error ? `Error: ${data.error}` : `${action === 'confirm' ? 'Confirmed' : 'Cancelled'}.`;
  card.appendChild(note);
  loadAuditLog();
}

async function loadAuditLog() {
  const res = await fetch('/agent/audit-log?limit=30');
  const log = await res.json();
  auditFeedEl.innerHTML = '';
  for (const entry of log.slice().reverse()) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<strong>${entry.tool}</strong>
      <span class="tier ${entry.risk_tier}">${entry.risk_tier}</span>
      <div style="color:#7a7461;margin-top:2px">${entry.status} · ${new Date(entry.timestamp).toLocaleTimeString()}</div>`;
    auditFeedEl.appendChild(card);
  }
}

document.getElementById('chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  addMsg('user', message);

  const res = await fetch('/agent/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, history }),
  });
  const data = await res.json();
  if (data.error) {
    addMsg('assistant', `(error) ${data.error}`);
    return;
  }
  history = data.history;
  addMsg('assistant', data.reply);
  renderToolTrace(data.tool_trace);
  loadAuditLog();
});

async function resetDemo() {
  await fetch('/agent/reset', { method: 'POST' });
  chatEl.innerHTML = '';
  toolFeedEl.innerHTML = '';
  history = [];
  loadAuditLog();
}

loadAuditLog();
</script>
</body>
</html>
